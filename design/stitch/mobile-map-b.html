<script>
        // Simple drag interaction script for visual completeness (non-functional physics)
        document.addEventListener('DOMContentLoaded', () => {
            const handle = document.querySelector('.cursor-grab');
            const sheet = handle.parentElement;
            
            let startY;
            
            handle.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
            }, {passive: true});
            
            handle.addEventListener('touchmove', (e) => {
                const currentY = e.touches[0].clientY;
                const diff = currentY - startY;
                
                // Allow dragging down slightly for effect
                if(diff > 0 && diff < 50) {
                    sheet.style.transform = `translateY(${diff}px)`;
                }
            }, {passive: true});
            
            handle.addEventListener('touchend', () => {
                sheet.style.transform = `translateY(0)`;
                sheet.style.transition = 'transform 0.3s ease-out';
                setTimeout(() => { sheet.style.transition = ''; }, 300);
            });
        });
    </script>
