<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'page-bg': '#e4e3e0',
                        'card-surface': '#fafaf9',
                        'primary-text': '#141414',
                        'secondary-text': '#636363',
                        'hairline': '#c8c7c4',
                        'accent-orange': '#f27d26',
                        'accent-ink': '#a85416',
                        'data-green': '#0a7a3e',
                        'data-amber': '#8e6b00',
                        'data-blue': '#267df2'
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "display": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]

                },
            },
        }

<style>
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Map style */
        .map-bg {
            background-color: #e4e3e0;
            background-image: radial-gradient(#c8c7c4 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="h-full w-full bg-page-bg font-body text-primary-text overflow-hidden relative map-bg">
<!-- Top Navigation Container (from JSON but hidden on mobile as per rules, using it as a structural guide if needed on web, but this is a mobile-first prompt) -->
<!-- TopAppBar -->
<header class="hidden md:flex items-center justify-between px-4 h-14 w-full top-0 bg-[#fafaf9] border-b border-[#c8c7c4] z-50 fixed">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#141414]">search</span>
</div>
<div class="font-headline font-bold text-xl tracking-tighter text-[#141414]">SKY SCORE</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#141414]">account_circle</span>
</div>
</header>
<!-- Map Area (Background) -->
<div class="absolute inset-0 z-0 w-full h-full flex flex-col pt-6 md:pt-20 px-4">
<!-- Search Field Overlay -->
<div class="w-full max-w-md mx-auto relative mb-4">
<div class="bg-card-surface border border-hairline rounded-lg flex items-center px-4 py-3">
<span class="material-symbols-outlined text-secondary-text mr-3">search</span>
<input class="w-full bg-transparent border-none p-0 text-sm focus:ring-0 placeholder-secondary-text font-body" placeholder="Enter a postcode or area" type="text"/>
</div>
</div>
<!-- Country Tabs -->
<div class="w-full max-w-md mx-auto mb-4">
<div class="flex gap-2 bg-card-surface p-1 rounded-lg border border-hairline">
<button class="flex-1 py-1.5 text-xs font-bold font-body uppercase tracking-widest text-accent-ink border-b-2 border-accent-orange text-center">United Kingdom</button>
<button class="flex-1 py-1.5 text-xs font-bold font-body uppercase tracking-widest text-secondary-text text-center hover:text-primary-text transition-colors">United States</button>
</div>
</div>
<!-- City Chips (Horizontal Scroll) -->
<div class="w-full max-w-md mx-auto mb-4 overflow-x-auto hide-scrollbar">
<div class="flex gap-2 px-1">
<button class="whitespace-nowrap px-4 py-1.5 bg-card-surface border border-accent-orange text-accent-ink text-xs font-bold font-label uppercase tracking-widest rounded-full">London</button>
<button class="whitespace-nowrap px-4 py-1.5 bg-card-surface border border-hairline text-secondary-text text-xs font-medium font-label uppercase tracking-widest rounded-full hover:text-primary-text">Greater Manchester</button>
<button class="whitespace-nowrap px-4 py-1.5 bg-card-surface border border-hairline text-secondary-text text-xs font-medium font-label uppercase tracking-widest rounded-full hover:text-primary-text">West Midlands</button>
<button class="whitespace-nowrap px-4 py-1.5 bg-card-surface border border-hairline text-secondary-text text-xs font-medium font-label uppercase tracking-widest rounded-full hover:text-primary-text">West Yorkshire</button>
</div>
</div>

</div>
</div>
<!-- Bottom Sheet Card (Peeking) -->
<div class="fixed bottom-16 left-0 w-full z-40 md:hidden">
<div class="bg-card-surface border-t border-hairline rounded-t-lg pt-2 pb-6 px-4 shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
<div class="w-12 h-1 bg-hairline rounded-full mx-auto mb-4"></div>
<div class="flex justify-between items-end mb-2">
<div class="font-label text-xs uppercase tracking-widest text-secondary-text font-bold">London Aggregate</div>
<div class="font-headline text-3xl font-bold tabular-nums text-primary-text">72.4</div>
</div>
<!-- Data bands mini representation -->
<div class="w-full h-2 flex mt-4 border border-hairline rounded overflow-hidden">
<div class="h-full bg-data-green w-1/3"></div>
<div class="h-full bg-data-amber w-1/2"></div>
<div class="h-full bg-page-bg w-1/6 relative">
<!-- missing data representation -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-full h-[1px] bg-hairline transform -rotate-45"></div>
</div>
</div>
</div>
<div class="flex justify-between mt-1 text-[10px] font-label text-secondary-text uppercase tracking-wider">
<span>Quiet Skies</span>
<span>Affordability</span>
<span>Unknown</span>
</div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-6 bg-[#fafaf9] border-t border-[#c8c7c4] md:hidden">
<button class="flex flex-col items-center justify-center text-[#a85416] w-full h-full hover:bg-[#e4e3e0] active:opacity-80 transition-opacity">
<span class="material-symbols-outlined mb-1">map</span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold">Search</span>
</button>
<button class="flex flex-col items-center justify-center text-[#636363] w-full h-full hover:bg-[#e4e3e0] active:opacity-80 transition-opacity">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold">Rankings</span>
</button>
<button class="flex flex-col items-center justify-center text-[#636363] w-full h-full hover:bg-[#e4e3e0] active:opacity-80 transition-opacity">
<span class="material-symbols-outlined mb-1">bookmark</span>
<span class="font-label text-[10px] uppercase tracking-widest font-bold">Saved</span>
</button>
</nav>
