openapi: 3.0.3
info:
  title: Sky Score API
  description: |
    Sky Score is a noise + livability data API for UK property. The score
    is a 0-10 holistic property quality signal computed from four
    components: Quiet (aviation + road noise), Affordability (cohort-relative
    price), Growth (price-trend signal), and Liveability (schools, crime,
    transport, healthcare).

    **Authentication.** All endpoints require an API key passed in the
    `X-Api-Key` header. Free tier provides 100 requests/month, 5/sec burst,
    1/sec sustained. A `/v1/score/batch` request counts as one request and
    carries up to 100 queries, so the free ceiling is 10,000 scores/month.
    Contact via the [consumer site](https://skyscore.co.uk/) for a key.

    **Methodology.** Every numeric threshold and weight is anchored to a
    published source or explicit editorial decision in the
    [methodology document](https://github.com/billkhiz-bit/london-flight-path-map/blob/master/METHODOLOGY.md).
    The methodology is reproducible: a worked example walks through every
    calculation against a real postcode.

    **Coverage.** 33 London boroughs by UK postcode resolution (postcodes.io).
    5 NYC boroughs by borough-name lookup or 5-digit US ZIP auto-detection
    (~182 residential ZIPs covered; ~110 with per-ZIP centroid for finer
    quiet-score resolution).
  version: "1.1"
  contact:
    name: Sky Score
    url: https://skyscore.co.uk/
  license:
    name: Proprietary
    url: https://github.com/billkhiz-bit/london-flight-path-map/blob/master/LICENSE

servers:
  - url: https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod
    description: Production API

security:
  - ApiKeyAuth: []

tags:
  - name: Score
    description: Single-postcode and bulk property scoring.

paths:
  /v1/signup:
    post:
      tags: [Onboarding]
      security: []
      summary: Self-service API key issuance.
      description: |
        Create a new free-tier API key. Unauthenticated by design (this is
        the entry point — the form on `/score-demo/index.html` POSTs here).
        One key per email; subsequent calls with the same email return 409.
        Per-route APIGW throttle of 1 RPS / 5 burst gates abuse; CORS is
        allow-listed to `https://skyscore.co.uk` and the legacy CloudFront
        URL only.

        The returned `apiKey` is shown ONCE — store it immediately. There is
        no "re-issue" endpoint; lost keys require contacting support.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  example: you@example.com
                name:
                  type: string
                  maxLength: 200
                  description: Optional display name; appears in the APIGW key description for support tracking.
                  example: Optional Display Name
      responses:
        '201':
          description: Key created.
          content:
            application/json:
              schema:
                type: object
                required: [apiKey, keyId, usagePlan, limits, note, docs]
                properties:
                  apiKey:
                    type: string
                    description: The key value. Pass as `X-Api-Key` on `/v1/score*`.
                    example: 'YOUR-NEW-API-KEY-VALUE-SHOWN-ONCE'
                  keyId:
                    type: string
                  usagePlan:
                    type: string
                    example: 'SkyScoreFreeTier'
                  limits:
                    type: object
                    properties:
                      monthlyQuota:
                        type: integer
                        description: Requests per month, not scores. See batchMultiplier.
                        example: 100
                      burstLimit:
                        type: integer
                        example: 5
                      sustainedRateLimit:
                        type: integer
                        example: 1
                      batchMultiplier:
                        type: integer
                        description: >-
                          Maximum queries in one /v1/score/batch request. A batch
                          request costs one unit of monthlyQuota regardless of how
                          many queries it carries.
                        example: 100
                      monthlyScoreCeiling:
                        type: integer
                        description: monthlyQuota x batchMultiplier, the real ceiling.
                        example: 10000
                  note:
                    type: string
                    description: Reminder that the key is shown once.
                  docs:
                    type: string
                    example: 'https://skyscore.co.uk/score-demo/api-docs.html'
        '400':
          description: Invalid email or oversized fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email has already signed up. No key is re-issued via this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Per-route throttle exceeded (1 RPS / 5 burst).
        '503':
          description: APIGW key creation upstream failure (rare; per-account quota).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/regions:
    get:
      tags: [Score]
      summary: List supported cities and boroughs.
      description: |
        Discovery endpoint for integrators. Returns the supported cities,
        their borough lists, postcode formats, and resolver methods. Use
        this to know what queries to issue without scraping responses.
      responses:
        '200':
          description: Supported regions and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
        '403':
          description: API key missing or invalid.

  /v1/changes:
    get:
      tags: [Score]
      summary: Quarter-over-quarter borough score movement (no API key).
      description: |
        Public endpoint (no key required): every London borough's score under
        the balanced persona, current vs previous quarterly data vintage,
        sorted by size of score change, with a summary (risers, fallers,
        largest movers). This powers the public page at
        `https://skyscore.co.uk/changes`. Updated with each quarterly
        refresh; `note` documents any methodology caveat for the period.

        Every borough also carries **why** it moved. The score is a weighted
        sum, so a change decomposes exactly: `scoreChange` equals the sum of
        `weight x componentChange` over the factors. `attribution[]` gives
        that decomposition and `explanation` renders it as a sentence. The
        top-level `weights` object is published so you can reproduce each
        contribution yourself.

        Because contributions are derived from the published 1dp component
        values, they reconcile with `scoreChange` to within rounding rather
        than exactly. `attributionSum` and `roundingResidual` state that gap
        explicitly — treat a residual under 0.2 as normal rounding, not an
        error. Only price and trend move between quarterly vintages, so
        `afford` and `growth` are the only factors that can appear.

        **Two factors are relative, which explains large swings.** Growth is
        scored against the strongest-growing borough and affordability against
        the cheapest and dearest, so a modest change in an input can move a
        score a long way — and an area that IS the benchmark scores the maximum
        by definition, leaving it nowhere to go but down. `why.drivers[]`
        therefore carries `workings`: the actual sum with the reference point
        named, e.g. `+0.9% ÷ +5.0% (Waltham Forest, the strongest) × 10 = 1.8`.
        Use `why.caveats[]` for limits worth surfacing to an end user — most
        importantly that a negative trend floors growth at 0, so a slight dip
        and a steep fall are indistinguishable on that factor.

        `marketContext` gives the city-wide picture (mean trend then/now, count
        of falling areas then/now, and the growth benchmark then/now). Read it
        before interpreting any single row: when most areas move together, the
        cause is the market rather than a reassessment of one area.
      security: []
      responses:
        '200':
          description: Movement table + summary for the current vintage pair.
          content:
            application/json:
              schema:
                type: object
                description: |
                  `summary` (counts + largest movers), `changes[]` (per
                  borough: score, previousScore, scoreChange, avgPriceGbp,
                  previousAvgPriceGbp, priceChangePct, trendPct,
                  previousTrendPct, components, previousComponents,
                  attribution[], attributionSum, roundingResidual,
                  explanation, why), `weights`, `marketContext`,
                  `attributionNote`, vintage identifiers, and the standard
                  meta fields (methodologyVersion, sources, generatedAt).
                  Each `attribution[]` entry has: factor, label, before,
                  after, change, weight, contribution.
                  `why` has: headline, drivers[], caveats[], summary — where
                  each driver carries factor, label, before, after, change,
                  contribution, what, because, workings, weightNote.
                  `explanation` is the flattened form of `why.summary` and is
                  self-contained (it includes the workings and caveats).
                  `marketContext` has: areas, meanTrendPct,
                  previousMeanTrendPct, fallingAreas, previousFallingAreas,
                  benchmarks, previousBenchmarks, summary.

  /v1/score:
    get:
      tags: [Score]
      summary: Get Sky Score for a single postcode or borough.
      description: |
        Returns the 0-10 Sky Score for a given UK postcode (resolved via
        postcodes.io to a London borough) or a borough name in a supported
        city. Optionally accepts a persona preset or a custom weights
        override.

        ### Code samples

        **curl**
        ```bash
        curl 'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score?postcode=SW11+1AA' \
          -H 'X-Api-Key: YOUR_KEY'
        ```

        **Python (stdlib)**
        ```python
        from urllib.parse import quote
        from urllib.request import Request, urlopen
        import json

        url = 'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score'
        req = Request(f'{url}?postcode={quote("SW11 1AA")}',
                      headers={'X-Api-Key': 'YOUR_KEY'})
        with urlopen(req, timeout=5) as r:
            data = json.loads(r.read())
        print(data['score'], data['components'])
        ```

        **Python (requests)**
        ```python
        import requests
        r = requests.get(
            'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score',
            params={'postcode': 'SW11 1AA', 'persona': 'family'},
            headers={'X-Api-Key': 'YOUR_KEY'},
            timeout=5,
        )
        r.raise_for_status()
        print(r.json()['score'])
        ```

        **Node.js (fetch, 18+)**
        ```js
        const url = new URL('https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score');
        url.searchParams.set('postcode', 'SW11 1AA');
        const r = await fetch(url, { headers: { 'X-Api-Key': 'YOUR_KEY' } });
        const data = await r.json();
        console.log(data.score, data.components);
        ```

        **Browser (fetch)**
        ```js
        const r = await fetch(
          'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score?postcode=SW11+1AA',
          { headers: { 'X-Api-Key': 'YOUR_KEY' } },
        );
        const { score, components } = await r.json();
        ```
      parameters:
        - name: postcode
          in: query
          description: |
            Postcode/ZIP to score. UK postcodes (e.g. `SW11 1AA`) resolve
            via postcodes.io to a London borough. US ZIPs (e.g. `10001`,
            5-digit with optional `+4` suffix) auto-detect to NYC and use
            a static borough lookup. Spaces in UK postcodes are URL-encoded
            (`%20`). Required if `borough` is not provided.
          schema:
            type: string
            example: SW11 1AA
        - name: borough
          in: query
          description: |
            Borough name to score. Required if `postcode` is not provided.
            Supported names depend on `city`.
          schema:
            type: string
            example: Wandsworth
        - name: city
          in: query
          description: City context for borough lookup.
          schema:
            type: string
            enum: [london, nyc]
            default: london
        - name: persona
          in: query
          description: |
            Persona preset that determines the weighting of the four
            components. See the methodology document for the precise weight
            values. Ignored if `weights` is provided.
          schema:
            type: string
            enum: [balanced, family, investor, firsttime, quietlife, renter, commuter, laterlife]
            default: balanced
        - name: weights
          in: query
          description: |
            Custom weights override. Format: `quiet:W,afford:X,growth:Y,live:Z`
            where W+X+Y+Z must equal 1.0 (within ±0.01). If invalid, the
            persona preset (or balanced) is used. When applied, the response
            indicates `persona: "custom"`.
          schema:
            type: string
            example: "quiet:0.5,afford:0.2,growth:0.1,live:0.2"
        - name: include
          in: query
          description: |
            Comma-separated list of top-level response fields to keep. Lets
            integrators reduce response payload to only the fields they
            consume. Meta fields (`apiVersion`, `methodologyVersion`,
            `methodologyUrl`, `generatedAt`, `sources`) are always returned
            regardless of filter. Unknown fields are ignored silently.
            Recognised fields: `score`, `components`, `comparison`, `context`,
            `location`, `persona`, `weights`, `sourceBreakdown`,
            `plannedComponents`.
          schema:
            type: string
            example: "score,components,context"
        - name: compare
          in: query
          description: |
            Set to `previous` to add a `comparison` block: the same location
            scored against the previous quarterly data vintage under the
            current methodology, with `previousScore`, `scoreChange`,
            `previousComponents` and price movement. Vintages are identified
            by quarter (e.g. `2026-Q1` → `2026-Q2`). Where a city had no
            refresh between vintages the comparison honestly reports zero
            change.
          schema:
            type: string
            enum: [previous]
            example: previous
        - name: methodology
          in: query
          description: |
            Pin the response to a specific methodology version for
            reproducibility during integration / change-grace-period.
            When omitted, the latest methodology applies. Documented in
            METHODOLOGY.md §16 (API contract and stability) — prior
            methodology versions remain accessible for 14 days after a
            new version's release. Best-effort: if the requested version
            is not retained, the latest is used and `methodologyVersion`
            in the response indicates which version actually applied.
          schema:
            type: string
            example: "3.2"
        - name: includeTerminated
          in: query
          description: |
            Opt in to scoring **terminated** (retired) postcodes. Off by
            default: without this flag a terminated postcode returns `404`,
            which is the behaviour every response served without it can
            rely on.

            **Why opt-in and not default.** Terminated postcodes are real
            postcodes — they keep appearing in HM Land Registry Price Paid
            and EPC exports long after ONS retires them, so any backfill
            over historic transactions will hit them, and refusing to score
            them at all would be unhelpful. But their centroids are
            materially coarser than live ones: only 0.3% of live London
            postcodes carry a coarse grid reference — imputed, sector-mean
            or pre-Gridlink rather than surveyed to the building — against
            36.9% of terminated London ones. A `quiet` component sampled at
            such a centroid can be hundreds of metres from the actual
            address, far enough to cross a noise contour band.
            Turning that on by default would quietly degrade precision for
            every integrator; making it opt-in keeps the trade-off
            explicit, and the response marks exactly which rows are
            affected (see `postcodeStatus`, `postcodeTerminatedDate` and
            `positionQuality` on `Location`).

            Terminated postcodes are served from the local ONS NSPL index
            only — the postcodes.io fallback does not carry them — so a
            terminated postcode absent from that index still returns `404`.
            The flag has no effect on `borough` queries or on US ZIPs.

            **Accepted values.** Truthy is `1`, `true`, `yes`, `y` or `on`,
            case-insensitive with surrounding whitespace ignored. Every
            other string is false, including `0`, `false` and `""`. In a
            `/v1/score/batch` query object the value may instead be a JSON
            boolean (`true` / `false`) or a number (any non-zero number is
            true; `0` and `0.0` are false); `null`, arrays and objects are
            false. An unrecognised value never raises an error, it simply
            leaves the flag off.
          schema:
            type: boolean
            default: false
            example: true
      responses:
        '200':
          description: Score successfully computed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
        '400':
          description: Invalid request (missing postcode/borough, or bad parameter).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API key missing or invalid.
        '404':
          description: |
            Postcode not recognised by postcodes.io, or borough not in dataset
            for the requested city. Response includes `supportedBoroughs`
            for graceful fallback. Terminated (retired) postcodes are also
            reported here unless `includeTerminated` is set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.

  /v1/score/batch:
    post:
      tags: [Score]
      summary: Bulk Sky Score lookup (up to 100 queries per call).
      description: |
        Submits up to 100 score queries in a single API call. Each query is
        independent, failures do not abort the batch; failed queries return
        an error per item and the batch continues. Suitable for aggregator
        and conveyancing-search workflows that look up many properties at
        once.

        **Counting against rate limits.** A batch call counts as 1 API
        request against your monthly quota, regardless of the number of
        queries. The 100-query limit per batch caps the work per request.

        ### Code samples

        **curl**
        ```bash
        curl -X POST 'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score/batch' \
          -H 'X-Api-Key: YOUR_KEY' \
          -H 'Content-Type: application/json' \
          -d '{"queries":[{"postcode":"SW11 1AA"},{"postcode":"10001","persona":"investor"}]}'
        ```

        **Python (requests)**
        ```python
        import requests
        r = requests.post(
            'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score/batch',
            json={'queries': [
                {'postcode': 'SW11 1AA'},
                {'postcode': 'TW3 4DX', 'persona': 'family'},
                {'borough': 'Hackney', 'city': 'london',
                 'weights': {'quiet': 0.5, 'afford': 0.2, 'growth': 0.1, 'live': 0.2}},
            ]},
            headers={'X-Api-Key': 'YOUR_KEY'},
            timeout=20,
        )
        r.raise_for_status()
        for row in r.json()['results']:
            if row['status'] == 200:
                print(row['location']['borough'], row['score'])
            else:
                print(f'queryIndex {row["queryIndex"]}: {row["error"]}')
        ```

        **Node.js (fetch, 18+)**
        ```js
        const r = await fetch(
          'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/score/batch',
          { method: 'POST',
            headers: { 'X-Api-Key': 'YOUR_KEY', 'Content-Type': 'application/json' },
            body: JSON.stringify({ queries: [
              { postcode: 'SW11 1AA' },
              { postcode: '10001', persona: 'investor' },
            ]}),
          },
        );
        const { results } = await r.json();
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            example:
              queries:
                - postcode: "SW11 1AA"
                  persona: balanced
                - postcode: "TW3 4DX"
                  persona: family
                - borough: "Hackney"
                  city: london
                  weights:
                    quiet: 0.5
                    afford: 0.2
                    growth: 0.1
                    live: 0.2
      responses:
        '200':
          description: Batch processed (each query may individually succeed or fail).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '400':
          description: Invalid batch (missing queries array, exceeds limit, malformed JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: API key missing or invalid.
        '429':
          description: Rate limit exceeded.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        API key issued via the SkyScoreFreeTierKey usage plan (100 req/month,
        5/sec burst, 1/sec sustained on the free tier, and up to 10,000
        scores/month once the batch multiplier is counted). Contact for paid
        tiers.

  schemas:
    ScoreResponse:
      type: object
      required: [score, components, location, persona, weights, methodologyVersion, apiVersion, generatedAt, sources]
      properties:
        score:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: Headline Sky Score (one decimal precision).
          example: 6.1
        components:
          $ref: '#/components/schemas/Components'
        context:
          $ref: '#/components/schemas/Context'
        location:
          $ref: '#/components/schemas/Location'
        persona:
          type: string
          enum: [balanced, family, investor, firsttime, quietlife, custom]
          description: |
            Which weighting profile produced the score. `"custom"` indicates
            the `weights` query parameter was applied.
        weights:
          $ref: '#/components/schemas/Weights'
        methodologyVersion:
          type: string
          example: "3.2"
        methodologyUrl:
          type: string
          format: uri
        apiVersion:
          type: string
          example: "1.0"
        generatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
          description: |
            OGL attribution lines for the underlying data sources.
            Consumers redistributing the response must preserve these.
        sourceBreakdown:
          type: object
          description: |
            Per-component data lineage. Each property describes the source
            and methodology for that component. The `/v1/score` endpoint
            does NOT depend on OpenSky Network, aviation noise context is
            sourced from pre-computed DEFRA borough-aggregate Lden bands.
          properties:
            quiet:
              type: string
            afford:
              type: string
            growth:
              type: string
            live:
              type: string
        plannedComponents:
          type: object
          description: |
            Roadmap-visible placeholders for components that are scoped but
            not yet shipped. Each entry has a `status` flag, integrators
            should NOT consume placeholder data as if it were live. The
            shape is stable; live components migrate from this block into
            `components` / `context` when they ship.
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [planned, beta]
              source:
                type: string
              eta:
                type: string

    RegionsResponse:
      type: object
      required: [cities, apiVersion, methodologyVersion, generatedAt]
      properties:
        cities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum: [london, nyc]
              name:
                type: string
              country:
                type: string
              currency:
                type: string
              postcodeFormat:
                type: string
              postcodeResolver:
                type: string
              boroughCount:
                type: integer
              boroughs:
                type: array
                items:
                  type: string
              supportedZipCount:
                type: integer
                description: NYC only, number of ZIPs in the static lookup.
        apiVersion:
          type: string
        methodologyVersion:
          type: string
        methodologyUrl:
          type: string
          format: uri
        generatedAt:
          type: string
          format: date-time

    Components:
      type: object
      required: [quiet, afford, growth, live]
      properties:
        quiet:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: Aviation + road noise impact, 10 = quietest.
        afford:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: Cohort-relative affordability, 10 = cheapest in cohort.
        growth:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: Linear price trend scaled to cohort max.
        live:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: Liveability composite (35% schools + 30% crime + 25% transport + 10% healthcare).

    Context:
      type: object
      description: Underlying inputs used to compute the components.
      properties:
        avgPriceGbp:
          type: number
          description: Borough average sold price in GBP (London).
        avgPriceUsd:
          type: number
          description: Borough average price in USD (NYC).
        priceTrendPct:
          type: number
          description: Annualised price growth percentage.
        noiseImpactBand:
          type: string
          enum: [low, low-moderate, moderate, moderate-high, high, severe]
          description: DEFRA Lden band classification (borough-aggregate).
        quietResolution:
          type: string
          enum: [borough, postcode, raster]
          description: |
            Which resolution tier produced the `quiet` score. Resolves
            highest-precision-first:
              `raster`, DEFRA Lden raster sample at postcode centroid (v3.1)
                        — NOT CURRENTLY RETURNED, see the note below
              `postcode`, Haversine to airports + flight-path geometry (v3.0)
              `borough`, Borough-aggregate Lden band (v2.x fallback)

            NOTE (August 2026): the `raster` tier is bypassed while a coverage
            problem is resolved, so this field returns `postcode` or `borough`
            only. DEFRA's aircraft contours cover roughly a tenth of London and
            the unmapped remainder was being treated as quiet. `raster` is kept
            in the enum because it is a valid value of the contract and will
            return once the tier is restored — do not treat its absence as
            permanent, and do not filter on it expecting results today.

            Integrators can use this to surface precision metadata to end
            users or filter for higher-precision results.

    Location:
      type: object
      properties:
        city:
          type: string
          enum: [london, nyc]
        postcode:
          type: string
        borough:
          type: string
        longitude:
          type: number
        latitude:
          type: number
        region:
          type: string
        postcodeStatus:
          type: string
          enum: [terminated]
          description: |
            Present only when the scored postcode is a terminated (retired)
            one, which requires `includeTerminated`. There is no `"live"`
            counterpart — absence of the key means the postcode was live at
            the ONS NSPL vintage named in `sources` — so test for the key
            rather than comparing against a string.
          example: terminated
        postcodeTerminatedDate:
          type: string
          nullable: true
          description: |
            Month ONS retired the postcode, `YYYY-MM`. Accompanies
            `postcodeStatus`, and is `null` where the source record carries
            no usable termination month.
          example: "1984-12"
        positionQuality:
          type: string
          enum: [approximate]
          description: |
            Present only alongside `postcodeStatus: terminated`, and then
            only for the ~36.9% of terminated London postcodes whose ONS
            grid reference is imputed, sector-mean or pre-Gridlink rather
            than surveyed to the building. Treat the centroid — and so the
            `quiet` component derived from it — as accurate to a few
            hundred metres, not to the building. Its absence on a
            terminated postcode means ONS does not flag the centroid as
            coarse; live postcodes never carry the key.
          example: approximate

    Weights:
      type: object
      required: [quiet, afford, growth, live]
      properties:
        quiet:
          type: number
          minimum: 0
          maximum: 1
        afford:
          type: number
          minimum: 0
          maximum: 1
        growth:
          type: number
          minimum: 0
          maximum: 1
        live:
          type: number
          minimum: 0
          maximum: 1

    BatchRequest:
      type: object
      required: [queries]
      properties:
        queries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              postcode:
                type: string
              borough:
                type: string
              city:
                type: string
                enum: [london, nyc]
              persona:
                type: string
                enum: [balanced, family, investor, firsttime, quietlife]
              weights:
                $ref: '#/components/schemas/Weights'
              includeTerminated:
                type: boolean
                default: false
                description: |
                  Per-query opt-in to terminated (retired) postcodes, same
                  semantics as the `/v1/score` query parameter of the same
                  name. Accepts a JSON boolean, a number (non-zero is
                  true), or the strings `1` / `true` / `yes` / `y` / `on`.
                  There is no batch-level switch — set it on each query
                  object that needs it.

    BatchResponse:
      type: object
      required: [totalQueries, successCount, errorCount, results, apiVersion, methodologyVersion, generatedAt, sources]
      properties:
        totalQueries:
          type: integer
        successCount:
          type: integer
        errorCount:
          type: integer
        apiVersion:
          type: string
        methodologyVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        sources:
          type: array
          items:
            type: string
        results:
          type: array
          items:
            type: object
            description: |
              Each result includes `queryIndex` and `status`. On 200, the
              full ScoreResponse fields are merged in. On error, includes
              `error` and optionally `attemptedBorough`/`supportedBoroughs`.
            properties:
              queryIndex:
                type: integer
              status:
                type: integer
              error:
                type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        attemptedBorough:
          type: string
        supportedBoroughs:
          type: array
          items:
            type: string
        supportedCities:
          type: array
          items:
            type: string
        example:
          type: object
