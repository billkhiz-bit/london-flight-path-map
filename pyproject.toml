[project]
name = "sky-score-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["backend/lambdas"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear (catches real bugs)
  "S",    # flake8-bandit (security)
  "UP",   # pyupgrade
]
ignore = [
  "S101",  # allow assert in tests
  "S104",  # binding to all interfaces
  "S113",  # request timeout
  "S110",  # try-except-pass is intentional for type coercion
  "S310",  # urlopen audit - all our URLs are https://
  "E501",  # line length handled by formatter
  "E701",  # one-line if/return in lookup tables is readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
