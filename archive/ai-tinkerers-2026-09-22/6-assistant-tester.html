<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant tester</title>
<style>
  /* Local demo page. Replaces the terminal: asks /v1/chat from the browser and
     shows the answer and the grounded flag at projector size. The API key is
     pasted once and kept in sessionStorage - this tab only, gone when it closes.
     It is never written into this file, which lives in OneDrive. */
  :root {
    --bg: #fbfaf7; --ink: #15161a; --mid: #5b5e66; --line: #b9bcc4; --box: #ffffff;
    --ok: #1a7f4b; --ok-bg: #e7f6ee; --no: #b3261e; --no-bg: #fdecea; --accent: #1f4fbf;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141518; --ink: #f2f2f0; --mid: #a9acb4; --line: #4a4d55; --box: #1e2024;
      --ok: #6fd39a; --ok-bg: #16311f; --no: #ff8a80; --no-bg: #3a1b18; --accent: #8ab4ff; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 500 clamp(18px, 1.5vw, 28px)/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 2vh 4vw 4vh; }
  h1 { font-size: 1.25em; margin: 0 0 0.6em; }
  h1 small { color: var(--mid); font-weight: 500; font-size: 0.7em; margin-left: 0.6em; }
  label { display: block; font-size: 0.75em; color: var(--mid); margin: 0.6em 0 0.15em; }
  input, button { font: inherit; }
  input { width: 100%; box-sizing: border-box; padding: 0.45em 0.7em; border: 2px solid var(--line);
    border-radius: 10px; background: var(--box); color: var(--ink); }
  input:focus { outline: 3px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 2fr; gap: 1.5vw; }
  .presets { display: flex; flex-wrap: wrap; gap: 0.6em; margin-top: 0.8em; }
  button { padding: 0.5em 1em; border-radius: 10px; border: 2px solid var(--line); background: var(--box);
    color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[disabled] { opacity: 0.6; cursor: wait; }
  #result { margin-top: 1.4em; }
  .badge { display: inline-block; padding: 0.35em 0.9em; border-radius: 999px; font-weight: 800;
    font-size: 1.6em; border: 3px solid; letter-spacing: 0.01em; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
  .badge.no { color: var(--no); background: var(--no-bg); border-color: var(--no); }
  .answer { font-size: 1.5em; margin: 0.6em 0 0.4em; padding: 0.7em 1em; border-left: 6px solid var(--line);
    background: var(--box); border-radius: 0 12px 12px 0; }
  .meta { color: var(--mid); font-size: 0.75em; }
  details { margin-top: 1em; }
  summary { cursor: pointer; color: var(--mid); font-size: 0.85em; }
  pre { font: 0.62em/1.35 ui-monospace, Consolas, monospace; background: var(--box); border: 2px solid var(--line);
    border-radius: 10px; padding: 0.8em 1em; overflow: auto; max-height: 45vh; white-space: pre; }
  mark { background: #ffe58a; color: #15161a; border-radius: 4px; padding: 0 0.15em; }
  .err { color: var(--no); font-weight: 700; }
  .keyrow { display: grid; grid-template-columns: 1fr auto; gap: 0.6em; align-items: end; }
  .hint { color: var(--mid); font-size: 0.7em; margin-top: 0.3em; }
</style>
</head>
<body>
<main>
  <h1>Assistant tester <small>POST /v1/chat, straight from this browser tab</small></h1>

  <div class="keyrow">
    <div>
      <label for="key">API key (the CI key - pasted once, kept in this tab only)</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="paste the key, press Save">
    </div>
    <button id="savekey" type="button">Save to this tab</button>
  </div>
  <div class="hint" id="keystate">No key in this tab yet.</div>

  <div class="row">
    <div>
      <label for="postcode">Postcode</label>
      <input id="postcode" value="SW11 1AA" spellcheck="false">
    </div>
    <div>
      <label for="question">Question</label>
      <input id="question" value="Is SW11 1AA quiet?" spellcheck="false">
    </div>
  </div>

  <div class="presets" role="group" aria-label="Preset questions">
    <button type="button" data-q="Is SW11 1AA quiet?">1. "Is SW11 1AA quiet?"</button>
    <button type="button" data-q="What is the score out of 100?">2. "What is the score out of 100?"</button>
    <button type="button" data-q="What will house prices in SW11 be in 2030?">3. "Prices in 2030?" (may or may not fire)</button>
    <button id="ask" class="primary" type="button">Ask</button>
  </div>

  <section id="result" aria-live="polite"></section>
</main>

<script>
(function () {
  'use strict';
  var API = 'https://2gjfdzg20c.execute-api.eu-west-2.amazonaws.com/prod/v1/chat';
  var KEYNAME = 'skyscore-demo-key';
  var $ = function (id) { return document.getElementById(id); };

  function readKey() { try { return sessionStorage.getItem(KEYNAME) || ''; } catch (e) { return ''; } }
  function showKeyState() {
    var k = readKey();
    $('keystate').textContent = k ? 'Key saved in this tab. It goes when the tab closes.' : 'No key in this tab yet.';
  }
  $('savekey').addEventListener('click', function () {
    var v = $('key').value.trim();
    if (!v) { $('keystate').textContent = 'Nothing to save.'; return; }
    try { sessionStorage.setItem(KEYNAME, v); } catch (e) { /* private window: fall through, key stays in the field */ }
    $('key').value = '';
    showKeyState();
  });

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  // Numbers in the answer, highlighted so the room can see what the check looked at.
  // Display only - the verdict is the server's `grounded`, never recomputed here.
  function highlightNumbers(text) {
    // Digits glued to letters are a postcode ("SW11 1AA"), not a figure - leave them.
    // Escape each segment SEPARATELY: escaping first turns "can't" into "can&#39;t"
    // and the 39 inside the entity would be marked as a number (seen in testing).
    var re = /(?<![A-Za-z\d])\d[\d,]*(?:\.\d+)?(?![A-Za-z\d])/g;
    var out = '', last = 0, m;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
      last = m.index + m[0].length;
    }
    return out + esc(text.slice(last));
  }

  function render(html) { $('result').innerHTML = html; }

  function ask() {
    var key = readKey() || $('key').value.trim();
    var postcode = $('postcode').value.trim();
    var question = $('question').value.trim();
    if (!key) { render('<p class="err">No API key. Paste it above and press Save.</p>'); return; }
    if (!postcode || !question) { render('<p class="err">Need both a postcode and a question.</p>'); return; }

    $('ask').disabled = true;
    render('<p class="meta">Asking... (a cold start can take 4 seconds; warm is 1-2)</p>');
    var t0 = performance.now();

    fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': key },
      body: JSON.stringify({ question: question, postcode: postcode })
    }).then(function (res) {
      return res.text().then(function (body) { return { status: res.status, body: body }; });
    }).then(function (r) {
      var ms = Math.round(performance.now() - t0);
      var data;
      try { data = JSON.parse(r.body); } catch (e) { data = null; }
      if (r.status !== 200 || !data) {
        var why = r.status === 403 ? 'Key rejected (403). Is it the CI key? The free-tier key is denied on /v1/chat.'
                : r.status === 429 ? 'Rate-limited (429). Wait a few seconds.'
                : 'HTTP ' + r.status + '.';
        render('<p class="err">' + esc(why) + '</p><pre>' + esc(r.body).slice(0, 2000) + '</pre>');
        return;
      }
      var grounded = data.grounded === true;
      var html = '';
      html += '<span class="badge ' + (grounded ? 'ok' : 'no') + '">' + (grounded ? 'GROUNDED: TRUE' : 'GROUNDED: FALSE') + '</span>';
      html += ' <span class="meta">' + ms + ' ms</span>';
      html += '<p class="answer">' + highlightNumbers(data.answer || '') + '</p>';
      html += '<p class="meta">' + (grounded
        ? 'Every highlighted number is in the data below. The answer shipped.'
        : 'A number the model wrote is not in the data below. The model\'s sentence was thrown away and replaced with this one.') + '</p>';
      html += '<details><summary>The data the model was given (the only permitted source)</summary><pre>'
           + esc(JSON.stringify(data.context, null, 1)) + '</pre></details>';
      render(html);
    }).catch(function (e) {
      render('<p class="err">Request failed: ' + esc(e.message) + '. Is the wifi up? The saved curl outputs are the fallback.</p>');
    }).finally(function () { $('ask').disabled = false; });
  }

  $('ask').addEventListener('click', ask);
  $('question').addEventListener('keydown', function (e) { if (e.key === 'Enter') ask(); });
  Array.prototype.forEach.call(document.querySelectorAll('.presets button[data-q]'), function (b) {
    b.addEventListener('click', function () { $('question').value = b.getAttribute('data-q'); ask(); });
  });
  showKeyState();
})();
</script>
</body>
</html>
