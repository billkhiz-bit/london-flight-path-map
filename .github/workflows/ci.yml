name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check backend/lambdas/
      - run: ruff format --check backend/lambdas/

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-mock boto3
      # Gate on the maintained suite (backend/tests — the same one
      # /preflight runs). The root tests/ Python suite is the March-era
      # legacy suite: it had been failing CI at collection since May
      # (test_chat imported the removed chat Lambda) and 21 of its tests
      # assert pre-migration handler behaviour. Triage tracked in
      # ROADMAP.md; re-add here once refreshed.
      - run: python -m pytest tests/ -v --tb=short
        working-directory: backend
        env:
          AWS_DEFAULT_REGION: eu-west-2

  test-e2e:
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
