name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # ADVISORY, and that is deliberate. /preflight has always treated
      # Prettier as advisory because reformatting an 8,000-line
      # index.html produces an unreviewable diff. CI treated it as
      # blocking, and because the test jobs `needs:` this one, a purely
      # cosmetic failure SKIPPED both suites - audit F30, no tests run
      # since 24 July 2026. A skipped job reports neither pass nor fail.
      - run: npm run format:check
        continue-on-error: true

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check backend/lambdas/
      # Advisory for the same reason as Prettier above.
      - run: ruff format --check backend/lambdas/
        continue-on-error: true

  # NOT `needs: lint-backend`. Style and correctness are independent, and
  # chaining them meant the only signal that matters could be withheld by
  # the one that does not. They now run in parallel.
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # numpy + pillow are NOT optional (added 2026-08-31). The root suite's
      # tests/test_empty_source_guards.py imports them inside test bodies -
      # no importorskip, no skip guard - so without them 8 tests ERROR and this
      # job is RED on every push for a reason that has nothing to do with the
      # code. That is one step beyond the 2026-08-30 fix (F30), which stopped
      # the test jobs being SKIPPED by a failing lint `needs:` only for them to
      # fail on imports instead: CI still produced no usable correctness signal.
      # Proven by stubbing both to raise ImportError - 254 passed locally,
      # 8 failed under CI's dependency set.
      #
      # The scripts under test import them lazily inside functions, so nothing
      # else in the suite needs them and the module-level imports stay stdlib.
      # pyproj added 2026-09-02, and PyYAML made explicit at the same time.
      # This job had been RED on EVERY run since at least 31 August - twelve
      # consecutive failures nobody looked at - on
      # `ModuleNotFoundError: No module named 'pyproj'`. Six tests reach it
      # through scripts/build_borough_bands.py `points_within()` and
      # scripts/build_city_stations.py `bng_to_wgs84()`, both of which import it
      # lazily inside the function, so the failure is invisible at collection
      # time and the suite passes locally where pyproj is installed.
      #
      # THIS IS THE SECOND TIME. The comment above records exactly the same
      # discovery for numpy + pillow on 31 August, and pyproj was missed in the
      # same pass - so the fix that was supposed to give CI a usable
      # correctness signal produced twelve more red runs instead. A
      # hand-written dependency list in a YAML file is the same shape as every
      # other frozen list this repo has paid for (copy-web.mjs's REQUIRED_DATA,
      # the deploy-target table, the free-tier mirrors): it is correct on the
      # day it is written and nothing makes it stay correct.
      #
      # PyYAML is not a new need - backend/tests imports it and passes today
      # only because the ubuntu runner image happens to ship it. Naming it means
      # a runner image change cannot quietly take the backend suite down.
      - run: pip install pytest pytest-mock boto3 numpy pillow pyproj pyyaml
      # backend/tests — the maintained suite (the same one /preflight runs).
      - run: python -m pytest tests/ -v --tb=short
        working-directory: backend
        env:
          AWS_DEFAULT_REGION: eu-west-2
      # Root tests/ — per-Lambda handler suites (epc, favourites, nhs,
      # sold_prices, transport). Rewritten 2026-07-24 to the current
      # handler contracts (MHCLG EPC JSON API, X-Device-Token auth,
      # OSM Overpass) after the March-era originals went stale.
      - run: python -m pytest tests/ -v --tb=short
        env:
          AWS_DEFAULT_REGION: eu-west-2

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
