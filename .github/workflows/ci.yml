name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # ADVISORY, and that is deliberate. /preflight has always treated
      # Prettier as advisory because reformatting an 8,000-line
      # index.html produces an unreviewable diff. CI treated it as
      # blocking, and because the test jobs `needs:` this one, a purely
      # cosmetic failure SKIPPED both suites - audit F30, no tests run
      # since 24 July 2026. A skipped job reports neither pass nor fail.
      - run: npm run format:check
        continue-on-error: true

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check backend/lambdas/
      # Advisory for the same reason as Prettier above.
      - run: ruff format --check backend/lambdas/
        continue-on-error: true

  # NOT `needs: lint-backend`. Style and correctness are independent, and
  # chaining them meant the only signal that matters could be withheld by
  # the one that does not. They now run in parallel.
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-mock boto3
      # backend/tests — the maintained suite (the same one /preflight runs).
      - run: python -m pytest tests/ -v --tb=short
        working-directory: backend
        env:
          AWS_DEFAULT_REGION: eu-west-2
      # Root tests/ — per-Lambda handler suites (epc, favourites, nhs,
      # sold_prices, transport). Rewritten 2026-07-24 to the current
      # handler contracts (MHCLG EPC JSON API, X-Device-Token auth,
      # OSM Overpass) after the March-era originals went stale.
      - run: python -m pytest tests/ -v --tb=short
        env:
          AWS_DEFAULT_REGION: eu-west-2

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
