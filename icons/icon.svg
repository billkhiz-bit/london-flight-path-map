<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sky Score app icon (full-bleed).
  Dark background + orange airplane silhouette using the same #F27D26
  accent colour the app uses for highlights / score indicators. Rounded
  corners at ~19% match iOS/Android icon-shape conventions; Android then
  applies its own shape mask (circle / squircle) on top — that's what the
  maskable variant in icon-maskable.svg is for.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sky Score">
  <rect width="512" height="512" rx="96" ry="96" fill="#141414"/>
  <g transform="translate(96 96) scale(13.333)" fill="#F27D26">
    <path d="M21,16v-2l-8-5V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/>
  </g>
</svg>
