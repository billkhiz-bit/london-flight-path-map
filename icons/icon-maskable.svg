<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sky Score maskable PWA icon. Same radar-rings + plane mark as
  icon.svg, but all meaningful content sits inside the inner 80% safe
  zone (a circle of radius 205 around centre 256) so Android launchers
  applying circular / squircle / teardrop shape masks don't clip the
  outer ring or cardinal ticks. Background colour bleeds to all edges.
  Spec: https://web.dev/maskable-icon/
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sky Score">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1c2944"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F27D26" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#F27D26" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#F27D26" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="discGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFA458"/>
      <stop offset="60%" stop-color="#F27D26"/>
      <stop offset="100%" stop-color="#C95E12"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <circle cx="256" cy="256" r="115" fill="url(#pulseGlow)"/>

  <g fill="none" stroke="#F27D26" stroke-linecap="round">
    <circle cx="256" cy="256" r="160" stroke-width="2" stroke-opacity="0.32"/>
    <circle cx="256" cy="256" r="115" stroke-width="2.25" stroke-opacity="0.55"/>
  </g>

  <circle cx="256" cy="256" r="68" fill="url(#discGrad)"/>

  <g transform="translate(256 256) rotate(-22)" fill="#FFFFFF">
    <path d="M 0,-44 L 4,-16 L 41,2 L 6,4 L 9.5,27 L 3,32 L 0,35 L -3,32 L -9.5,27 L -6,4 L -41,2 L -4,-16 Z"/>
    <circle cx="0" cy="0" r="2.5" fill="#1c2944"/>
  </g>
</svg>
