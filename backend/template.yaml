AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sky Score - Backend API

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256
    Environment:
      Variables:
        CORS_ORIGIN: 'https://d1oe4ftwutjpf.cloudfront.net'
  Api:
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization'"
      AllowOrigin: "'https://d1oe4ftwutjpf.cloudfront.net'"
    Auth:
      DefaultAuthorizer: NONE

Resources:

  # --- API Gateway ---
  FlightMapApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: Sky Score API
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  # --- AI Chatbot (Amazon Nova) ---
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/chat/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /chat
            Method: post

  # --- Multi-Agent Orchestrator (Nova Lite + Pro) ---
  MultiAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/multi_agent/
      Handler: app.handler
      Timeout: 90
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        MultiAgentPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /multi-agent
            Method: post

  # --- Land Registry Sold Prices (CORS proxy) ---
  SoldPricesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/sold_prices/
      Handler: app.handler
      Events:
        SoldPricesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /sold-prices
            Method: get

  # --- EPC Energy Ratings ---
  EpcFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/epc/
      Handler: app.handler
      Environment:
        Variables:
          EPC_API_KEY: !Ref EpcApiKey
          EPC_API_EMAIL: !Ref EpcApiEmail
      Events:
        EpcGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /epc
            Method: get

  # --- TfL Transport ---
  TransportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/transport/
      Handler: app.handler
      Events:
        TransportGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /transport
            Method: get

  # --- NHS GP Surgeries ---
  NhsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/nhs/
      Handler: app.handler
      Timeout: 45
      Events:
        NhsGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /nhs
            Method: get

  # --- Property Photo Analysis (Nova Pro Multimodal) ---
  AnalyzeImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/analyze_image/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        AnalyzeImagePost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /analyze-image
            Method: post

  # --- Document Analysis (EPC/Survey via Nova Pro) ---
  AnalyzeDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/analyze_document/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        AnalyzeDocumentPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /analyze-document
            Method: post

  # --- AI Report Generation (Nova Pro) ---
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/report/
      Handler: app.handler
      Timeout: 90
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        ReportPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /report
            Method: post

  # --- Favourites (DynamoDB) ---
  FavouritesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/favourites/
      Handler: app.handler
      Environment:
        Variables:
          FAVOURITES_TABLE: !Ref FavouritesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FavouritesTable
      Events:
        FavouritesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: get
        FavouritesPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: post
        FavouritesDelete:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: delete

  # --- DynamoDB Table ---
  FavouritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: london-flight-map-favourites
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: postcode
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: postcode
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

Parameters:
  EpcApiKey:
    Type: String
    Default: ''
    Description: EPC API key from epc.opendatacommunities.org (register for free)
  EpcApiEmail:
    Type: String
    Default: ''
    Description: Email used to register for EPC API

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${FlightMapApi}.execute-api.${AWS::Region}.amazonaws.com/prod/'
