AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sky Score - Backend API

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256
    Environment:
      Variables:
        CORS_ORIGIN: 'https://d1oe4ftwutjpf.cloudfront.net'
  Api:
    # CORS opened to any origin so third-party browser integrations can call
    # the public B2B endpoints (/v1/score and /v1/score/batch) directly.
    # The score endpoints are API-key-gated; the Bedrock-using endpoints
    # (chat, multi_agent) are protected by per-stage API Gateway throttling
    # rather than CORS. CORS does not protect against server-side abuse, so
    # the previous CloudFront-only origin restriction was protecting against
    # browser abuse only — opening it does not materially change the threat
    # model. Tighten via per-Lambda origin checks if browser-from-other-origin
    # abuse on Bedrock endpoints becomes observed.
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Api-Key,X-Device-Token'"
      AllowOrigin: "'*'"
    Auth:
      DefaultAuthorizer: NONE

Resources:

  # --- API Gateway ---
  FlightMapApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: Sky Score API
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  # --- AI Chatbot (Amazon Nova) ---
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/chat/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /chat
            Method: post

  # --- Multi-Agent Orchestrator (Nova Lite + Pro) ---
  MultiAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/multi_agent/
      Handler: app.handler
      Timeout: 90
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        MultiAgentPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /multi-agent
            Method: post

  # --- Land Registry Sold Prices (CORS proxy) ---
  SoldPricesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/sold_prices/
      Handler: app.handler
      Events:
        SoldPricesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /sold-prices
            Method: get

  # --- EPC Energy Ratings (new MHCLG service from 2026-05-30) ---
  EpcFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/epc/
      Handler: app.handler
      Environment:
        Variables:
          EPC_BEARER_TOKEN: !Ref EpcBearerToken
      Events:
        EpcGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /epc
            Method: get

  # --- TfL Transport ---
  TransportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/transport/
      Handler: app.handler
      Events:
        TransportGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /transport
            Method: get

  # --- NHS GP Surgeries ---
  NhsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/nhs/
      Handler: app.handler
      Timeout: 45
      Events:
        NhsGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /nhs
            Method: get

  # --- Property Photo Analysis (Nova Pro Multimodal) ---
  AnalyzeImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/analyze_image/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        AnalyzeImagePost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /analyze-image
            Method: post

  # --- Document Analysis (EPC/Survey via Nova Pro) ---
  AnalyzeDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/analyze_document/
      Handler: app.handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        AnalyzeDocumentPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /analyze-document
            Method: post

  # --- AI Report Generation (Nova Pro) ---
  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/report/
      Handler: app.handler
      Timeout: 90
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - 'arn:aws:bedrock:*::foundation-model/amazon.nova-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.amazon.nova-*'
      Events:
        ReportPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /report
            Method: post

  # --- Favourites (DynamoDB) ---
  FavouritesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/favourites/
      Handler: app.handler
      Environment:
        Variables:
          FAVOURITES_TABLE: !Ref FavouritesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FavouritesTable
      Events:
        FavouritesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: get
        FavouritesPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: post
        FavouritesDelete:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: delete

  # --- B2B Score API (/v1/score) — API-key gated ---
  ScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/score/
      Handler: app.handler
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          # Score endpoint is the productised B2B surface; allow any origin so
          # third-party integrators can call it. API-key auth gates abuse.
          CORS_ORIGIN: '*'
          # v3.1 DEFRA raster table — Lambda checks DynamoDB first for postcode
          # Lden samples; falls back to v3.0 Haversine if table empty/missing.
          NOISE_RASTER_TABLE: !Ref NoiseRasterTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NoiseRasterTable
      Events:
        ScoreGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/score
            Method: get
            Auth:
              ApiKeyRequired: true
        ScoreBatchPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/score/batch
            Method: post
            Auth:
              ApiKeyRequired: true
        RegionsGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/regions
            Method: get
            Auth:
              ApiKeyRequired: true

  ScoreApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: FlightMapApiprodStage
    Properties:
      Name: SkyScoreFreeTierKey
      Description: Initial free-tier API key for /v1/score. Rotate via console.
      Enabled: true
      StageKeys:
        - RestApiId: !Ref FlightMapApi
          StageName: prod

  ScoreFreeUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: FlightMapApiprodStage
    Properties:
      UsagePlanName: SkyScoreFreeTier
      Description: Free tier — 1000 requests/month, 5 req/sec burst.
      ApiStages:
        - ApiId: !Ref FlightMapApi
          Stage: prod
      Quota:
        Limit: 1000
        Period: MONTH
      Throttle:
        BurstLimit: 5
        RateLimit: 2

  ScoreFreeUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ScoreApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ScoreFreeUsagePlan

  # --- Self-service signup ---
  # POST /v1/signup creates a new APIGW key, links to ScoreFreeUsagePlan,
  # records the email in SignupsTable. Unauthenticated by design (form
  # signup) — abuse bounded by API Gateway throttle + idempotency on email.
  # See backend/lambdas/signup/app.py for handler logic.
  SignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/signup/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          # USAGE_PLAN_NAME is hardcoded to avoid a CloudFormation circular
          # dependency (SignupFunction → ScoreFreeUsagePlan → FlightMapApi
          # → SignupFunction). The signup Lambda resolves the plan ID at
          # runtime via apigateway:GET on /usageplans (cached per warm
          # container).
          USAGE_PLAN_NAME: SkyScoreFreeTier
          SIGNUPS_TABLE: !Ref SignupsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref SignupsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SignupsTable
        - Statement:
            - Effect: Allow
              Action:
                - apigateway:POST
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/apikeys'
                # Wildcard usage-plan ARN to avoid circular dependency on
                # ScoreFreeUsagePlan.
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys'
            - Effect: Allow
              Action:
                - apigateway:GET
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/usageplans'
            - Effect: Allow
              Action:
                # Rollback path — revoke a just-created key when a
                # signup race is detected (DDB ConditionExpression fails
                # after APIGW key already exists).
                - apigateway:DELETE
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/apikeys/*'
      Events:
        SignupPost:
          # No Auth block — default is no API key required, which is the
          # whole point of self-service signup. Abuse mitigated by API
          # Gateway throttle + per-email idempotency in the handler.
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/signup
            Method: post
        SignupOptions:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/signup
            Method: options

  # --- DynamoDB Table — Self-service signup audit log ---
  # Email is the partition key (one signup per email — duplicate signups
  # return 409 since APIGW won't let us re-show the key value after
  # creation). Stores keyId for revocation, createdAt for analytics.
  SignupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: london-flight-map-signups
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # --- DynamoDB Table — DEFRA noise raster samples (v3.1) ---
  # Populated by an offline data-loader script that samples the DEFRA
  # GeoTIFF at every UK postcode centroid. The Lambda reads from this table
  # when populated; falls back to v3.0 Haversine when empty/missing.
  # See scripts/load_defra_raster.py for the loader runbook.
  NoiseRasterTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Name matches the london-flight-map-* IAM-policy prefix used by the
      # flightmap-dev deploy user — see backend/iam-policy.json.
      TableName: london-flight-map-noise-raster
      AttributeDefinitions:
        - AttributeName: postcode
          AttributeType: S
      KeySchema:
        - AttributeName: postcode
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # --- DynamoDB Table ---
  FavouritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: london-flight-map-favourites
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: postcode
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: postcode
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

Parameters:
  EpcBearerToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: Bearer token from get-energy-performance-data.communities.gov.uk (sign in via GOV.UK One Login, copy from the My account page). Pass at deploy time, never commit.

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${FlightMapApi}.execute-api.${AWS::Region}.amazonaws.com/prod/'
