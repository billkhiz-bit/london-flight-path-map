AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sky Score - Backend API

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256
    Environment:
      Variables:
        # '*' — NOT the CloudFront URL. The site's canonical origin has been
        # https://skyscore.co.uk since May 2026; pinning this to the legacy
        # CloudFront domain made browsers on the canonical origin (and the
        # native app's WebView origin) silently block every consumer data
        # panel (epc, sold-prices, transport, nhs, favourites) — found by the
        # 2026-07-24 audit (A-0724-C1). These are public read proxies plus a
        # device-token-capability write endpoint; CORS never gated server-side
        # abuse (see the Api-level comment below), and signup keeps its own
        # stricter origin allow-list in code.
        CORS_ORIGIN: '*'
  Api:
    # CORS opened to any origin so third-party browser integrations can call
    # the public B2B endpoints (/v1/score and /v1/score/batch) directly.
    # The score endpoints are API-key-gated; the Bedrock-using endpoints
    # (chat, multi_agent) are protected by per-stage API Gateway throttling
    # rather than CORS. CORS does not protect against server-side abuse, so
    # the previous CloudFront-only origin restriction was protecting against
    # browser abuse only, opening it does not materially change the threat
    # model. Tighten via per-Lambda origin checks if browser-from-other-origin
    # abuse on Bedrock endpoints becomes observed.
    Cors:
      AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Api-Key,X-Device-Token'"
      AllowOrigin: "'*'"
    Auth:
      DefaultAuthorizer: NONE

Resources:

  # --- API Gateway ---
  FlightMapApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: Sky Score API
      MethodSettings:
        - HttpMethod: '*'
          ResourcePath: '/*'
          # 50/100, raised from 10/20 (2026-07-24 load test): the stage-wide
          # throttle is shared across ALL clients and capped every key at
          # ~5-6 successful req/s regardless of its usage plan — a single
          # bursty Professional integration (or two customers at once) would
          # 429 constantly. Per-customer fairness comes from usage-plan
          # throttles (free tier: 5 burst / 1 sustained), not this ceiling;
          # this is the whole-API circuit breaker. Signup keeps its own
          # 1 RPS override below.
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
        # Per-method override on /v1/signup (audit N-Code-2). The
        # global 10 RPS would let an attacker pump ~600 keys/min into
        # the AWS-account API-key quota (default 10,000) before the
        # quota errors start. 1 RPS / 5 burst is generous for human
        # signups but gates abuse to ~60/min.
        - HttpMethod: POST
          ResourcePath: /v1/signup
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 5
        # Per-method override on /epc. This route is intentionally
        # unauthenticated — the consumer site calls it from the browser with
        # no API key, so ApiKeyRequired here would go straight to a dark EPC
        # panel on skyscore.co.uk. Do NOT "fix" the open proxy that way.
        # Throttling is the control instead.
        #
        # 3 RPS / 6 burst. The Lambda makes exactly one upstream MHCLG call
        # per request with no memoisation, and Bill's bearer token is capped
        # at 6,000 requests / 5 min (= 20 RPS). 3 RPS sustained is 900 per
        # 5 min, ~15% of that quota, leaving headroom for genuine spikes and
        # for any other consumer of the same token; 6 burst absorbs a visitor
        # doing back-to-back postcode lookups without 429ing a real user.
        # Without this the route inherited the 50 RPS '*/*' ceiling, so an
        # anonymous flood could (a) exhaust the MHCLG quota and blank the EPC
        # panel for real visitors, and (b) starve GET /v1/score through the
        # shared stage bucket — the exact failure the 2026-07-24 soak showed.
        #
        # Declared here in source deliberately (same lesson as the score
        # routes below): CloudFormation MERGES stage method settings but
        # never removes ones it does not declare, so a console-set override
        # on this route would be invisible to this template and would survive
        # every deploy. This entry makes the template authoritative for /epc.
        - HttpMethod: GET
          ResourcePath: /epc
          ThrottlingRateLimit: 3
          ThrottlingBurstLimit: 6
        # /v1/score + /v1/score/batch MUST be declared here (2026-07-24
        # 100k soak): console-set overrides of 5 rps / 10 burst were live
        # on both product routes and invisible to this template — CFN
        # merges but never removes stage method settings it does not
        # declare, so the API's two revenue endpoints were silently capped
        # at 5 req/s for ALL customers combined. Declaring them makes the
        # template authoritative. Per-customer fairness still comes from
        # usage-plan throttles; these are the per-route ceilings.
        #
        # DO NOT add a second entry for either route below this block
        # (2026-07-25). Until today this list declared each of these two
        # routes TWICE — the 40/80 and 10/20 pair here, and an older
        # "audit I-D" pair at 5/10 further down. CloudFormation renders
        # MethodSettings into ORDERED UpdateStage patch operations, so the
        # later entry wins: the template's effective desired state was
        # still 5/10, identical to the pre-soak deployment, which is why
        # CFN emitted no patch on the 2026-07-24 21:41Z update and the
        # live 40/80 on GET /v1/score existed only as console drift from
        # the "fixed live" step of that session. The next deploy to touch
        # this property — adding /epc above was exactly that — would have
        # re-emitted the collection and silently reverted the primary paid
        # route to 5 rps for all tenants combined, reintroducing the very
        # outage the soak was run to find. The duplicate pair is deleted;
        # these values are now the single declared source of truth.
        #
        # The deleted block's rationale (audit I-D) is preserved here
        # because the concern is still valid: per-key usage-plan caps
        # bound cost, but one key spamming at the global ceiling can
        # starve other tenants, so a per-route ceiling gates the
        # noisy-neighbour case. 40/80 and 10/20 serve that purpose at the
        # headroom the soak proved is needed; 5/10 did not.
        - HttpMethod: GET
          ResourcePath: /v1/score
          ThrottlingRateLimit: 40
          ThrottlingBurstLimit: 80
        - HttpMethod: POST
          ResourcePath: /v1/score/batch
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  # --- Bedrock Lambdas REMOVED 2026-05-07 ---
  # ChatFunction, MultiAgentFunction, AnalyzeImageFunction,
  # AnalyzeDocumentFunction, ReportFunction were all dormant in this
  # template after the 2026-05-07 frontend removal of the AI features.
  # Smoke-test then revealed their API routes were still publicly invokable
  # (closed in commit 71a731c). The follow-up code-quality audit pointed
  # out that "dormant" Lambdas with intact bedrock:InvokeModel grants are
  # still attack surface — any future SAM template typo re-attaching the
  # Events block would re-open them.
  #
  # Decision (2026-05-07): delete the Lambdas + their IAM grants
  # entirely. Restoration recipe is "git revert" of the deletion commit
  # plus the original AI-removal commit (69905ee). Lambda source remains
  # in git history at last-working commit 5418d73 (live_flights pattern)
  # and 8edd4b0 (the AI-features Lambdas).

  # --- Land Registry Sold Prices (CORS proxy) ---
  SoldPricesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/sold_prices/
      Handler: app.handler
      Events:
        SoldPricesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /sold-prices
            Method: get

  # --- EPC Energy Ratings (new MHCLG service from 2026-05-30) ---
  EpcFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/epc/
      Handler: app.handler
      Environment:
        Variables:
          EPC_BEARER_TOKEN: !Ref EpcBearerToken
      Events:
        EpcGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /epc
            Method: get

  # --- TfL Transport ---
  TransportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/transport/
      Handler: app.handler
      Events:
        TransportGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /transport
            Method: get

  # --- NHS GP Surgeries ---
  NhsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/nhs/
      Handler: app.handler
      Timeout: 45
      Events:
        NhsGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /nhs
            Method: get

  # --- Live Aircraft Proxy REMOVED (OpenSky licensing) ---
  # The LiveFlightsFunction (proxy to OpenSky Network /api/states/all)
  # was removed in May 2026 because OpenSky's terms require a written
  # agreement for any operational / commercial use, and a consumer
  # surface on skyscore.co.uk falls under that even though the consumer
  # site is free. The Lambda code lives in git history (last working
  # commit: a214ba0); restore by reverting that commit and adding back
  # OpenSkyClientId / OpenSkyClientSecret parameters once a licence is
  # in place. Frontend was also disabled in the same change.

  # AnalyzeImage / AnalyzeDocument / Report functions removed in the
  # same deletion as Chat / MultiAgent above. See note at the top of
  # the Resources block.

  # --- Favourites (DynamoDB) ---
  FavouritesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/favourites/
      Handler: app.handler
      Environment:
        Variables:
          FAVOURITES_TABLE: !Ref FavouritesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FavouritesTable
      Events:
        FavouritesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: get
        FavouritesPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: post
        FavouritesDelete:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /favourites
            Method: delete

  # --- B2B Score API (/v1/score), API-key gated ---
  ScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/score/
      Handler: app.handler
      MemorySize: 256
      # 28s, not 10s: a worst-case /v1/score/batch (100 queries, cold caches)
      # could exceed 10s and lose the whole batch with no partial results
      # (A-0724-I4). API Gateway cuts integrations at 29s, so 28s is the
      # practical ceiling; single-score calls are unaffected (~100ms).
      Timeout: 28
      Environment:
        Variables:
          # Score endpoint is the productised B2B surface; allow any origin so
          # third-party integrators can call it. API-key auth gates abuse.
          CORS_ORIGIN: '*'
          # v3.1 DEFRA raster table, Lambda checks DynamoDB first for postcode
          # Lden samples; falls back to v3.0 Haversine if table empty/missing.
          NOISE_RASTER_TABLE: !Ref NoiseRasterTable
          # ONS NSPL postcode index. lookup_postcode resolves UK postcodes
          # from this table first (~5ms) and falls back to postcodes.io over
          # the network when the table is unset, empty, or does not hold the
          # postcode. Unset is a silent no-op: the API behaves exactly as it
          # did before this table existed.
          POSTCODE_TABLE: !Ref PostcodeTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref NoiseRasterTable
        # Read-only, never DynamoDBCrudPolicy: the Lambda must never write
        # this table. Only the offline loader (scripts/load_nspl.py) writes,
        # using the operator's own credentials rather than this role.
        - DynamoDBReadPolicy:
            TableName: !Ref PostcodeTable
      Events:
        ScoreGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/score
            Method: get
            Auth:
              ApiKeyRequired: true
        ScoreBatchPost:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/score/batch
            Method: post
            Auth:
              ApiKeyRequired: true
        RegionsGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/regions
            Method: get
            Auth:
              ApiKeyRequired: true
        ChangesGet:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            # Public by design (no key): quarter-over-quarter borough
            # movement is already public via the consumer site, and this
            # endpoint feeds the shareable /changes page. Stage-level
            # throttling still applies.
            Path: /v1/changes
            Method: get

  # NOTE: this resource is the original (now-rotated) demo key. The key
  # value itself was committed to score-demo/{index,status}.html in
  # commits 2280148 / 07ad823, see audit C2 in AUDIT_REPORT.md.
  # On 2026-05-06 a new key (id 1zy00lrqs5, name SkyScoreDemoKeyV2) was
  # created out-of-band via the AWS CLI, linked to ScoreFreeUsagePlan,
  # and the score-demo HTML files updated to use it. The original key
  # is left here in disabled state for audit-trail purposes; future
  # rotations should follow the same pattern (new resource alongside,
  # disable old, eventually delete).
  ScoreApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: FlightMapApiprodStage
    Properties:
      Name: SkyScoreFreeTierKey
      Description: Original demo key, rotated 2026-05-06, kept disabled for audit trail.
      Enabled: false
      StageKeys:
        - RestApiId: !Ref FlightMapApi
          StageName: prod

  ScoreFreeUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: FlightMapApiprodStage
    Properties:
      UsagePlanName: SkyScoreFreeTier
      Description: Free tier, 100 requests/month, 5 req/sec burst.
      # THIS PLAN IS THE SOURCE OF TRUTH FOR THE FREE TIER. Four places mirror
      # these numbers and none of them can read the plan at runtime:
      # backend/lambdas/signup/app.py (the signup response), pricing.html,
      # api/index.html and score-demo/openapi.yaml. Change them together.
      #
      # Quota meters REQUESTS; the product sells SCORES, and /v1/score/batch
      # carries up to MAX_BATCH_SIZE (100) queries per request. So the real
      # free ceiling is Limit x 100 scores/month, not Limit. Lowered 1000 -> 100
      # on 2026-07-29 (10,000 scores, was 100,000) because the old ceiling gave
      # away the entire volume proposition of the £499 Professional tier for
      # free, in under nine minutes. Reasoning and rejected options:
      # BATCH_METERING_DECISION.md.
      ApiStages:
        - ApiId: !Ref FlightMapApi
          Stage: prod
      Quota:
        Limit: 100
        Period: MONTH
      # RateLimit 2 -> 1 alongside the quota cut. It does not change the monthly
      # total, it doubles the time to drain it (500s -> 1000s), so the drain
      # reads as sustained use rather than a burst that is over before any
      # monthly-window alarm could notice.
      Throttle:
        BurstLimit: 5
        RateLimit: 1

  ScoreFreeUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ScoreApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ScoreFreeUsagePlan

  # Separate plan for the ONE shared demo key embedded in score-demo/*.html,
  # added 2026-07-29. Until now that key sat on ScoreFreeUsagePlan, so cutting
  # the free tier to 100 req/month would have capped the whole public "Try the
  # API" form at 100 requests shared across every visitor — a marketing page
  # that 429s for the rest of the month, with no alarm to say it had happened.
  #
  # BATCH_METERING_DECISION.md §3 rejects per-endpoint plans because they force
  # two API keys on every customer. That objection does not apply here: this is
  # one key, on our own page, issued to nobody. The demo form only ever makes
  # single /v1/score calls, so for this key requests genuinely equal scores and
  # a request quota is the honest unit.
  #
  # Deliberately NOT a place to be stingy — this key's job is to let a prospect
  # see a real score before they give up an email address.
  ScoreDemoUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: FlightMapApiprodStage
    Properties:
      UsagePlanName: SkyScoreDemoTier
      Description: Shared public demo key on /score-demo, 2000 requests/month.
      ApiStages:
        - ApiId: !Ref FlightMapApi
          Stage: prod
      Quota:
        Limit: 2000
        Period: MONTH
      Throttle:
        BurstLimit: 5
        RateLimit: 2

  # --- Self-service signup ---
  # POST /v1/signup creates a new APIGW key, links to ScoreFreeUsagePlan,
  # records the email in SignupsTable. Unauthenticated by design (form
  # signup), abuse bounded by API Gateway throttle + idempotency on email.
  # See backend/lambdas/signup/app.py for handler logic.
  SignupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/signup/
      Handler: app.handler
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          # USAGE_PLAN_NAME is hardcoded to avoid a CloudFormation circular
          # dependency (SignupFunction → ScoreFreeUsagePlan → FlightMapApi
          # → SignupFunction). The signup Lambda resolves the plan ID at
          # runtime via apigateway:GET on /usageplans (cached per warm
          # container).
          USAGE_PLAN_NAME: SkyScoreFreeTier
          SIGNUPS_TABLE: !Ref SignupsTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref SignupsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SignupsTable
        - Statement:
            # CreateApiKey. Tag-conditioned — see below for why this
            # statement covers /apikeys ONLY.
            - Effect: Allow
              Action:
                - apigateway:POST
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/apikeys'
              Condition:
                # Audit I-G follow-up: require the CreatedBy tag at creation
                # time too, not just at delete. Otherwise a code-path bug that
                # forgets tags={...} in apigw.create_api_key() would create
                # untagged keys outside this Lambda's own DELETE scope —
                # silent quota leak. The aws:RequestTag condition is enforced
                # by APIGW: a create_api_key call without this exact tag
                # value will be denied.
                StringEquals:
                  'aws:RequestTag/CreatedBy': 'SignupLambda'
            # Tagging permission for the create-with-tags call above.
            #
            # In API Gateway, tags are a SEPARATE resource path (/tags/{arn}),
            # not an attribute of the resource being tagged — TagResource is
            # PUT /tags/{arn}. AWS's own tag-based-access-control example
            # carries a standalone statement for arn:aws:apigateway:*::/tags/*
            # alongside the resource statements, for exactly this reason.
            #
            # The I-G hardening (dab713d, 2026-05-07) added tags={...} to
            # apigw.create_api_key() and the aws:RequestTag condition above,
            # but never granted the tagging path — so every self-service
            # signup was denied at CreateApiKey, before a key was ever made.
            # The 2026-07-25 statement split fixed the SECOND failure
            # (CreateUsagePlanKey) while this, the first one, stayed live.
            # Diagnosed 2026-07-26 by elimination: failed signups leave no
            # API key and no orphan, so the denial precedes key creation.
            #
            # Condition retained deliberately: dropping it would let this
            # Lambda write arbitrary tags onto any API Gateway resource in
            # the account, re-opening a wider hole than I-G ever closed.
            - Effect: Allow
              Action:
                - apigateway:PUT
                - apigateway:POST
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/tags/*'
              Condition:
                StringEquals:
                  'aws:RequestTag/CreatedBy': 'SignupLambda'
            # CreateUsagePlanKey. DELIBERATELY NOT tag-conditioned. Do NOT
            # fold this back into the statement above in a future hardening
            # pass — that merge is what broke the funnel the first time.
            #
            # Why the condition cannot apply here: a UsagePlanKey is not a
            # taggable API Gateway resource. The CreateUsagePlanKey request
            # shape is {usagePlanId, keyId, keyType} with no tags member at
            # all (confirm with `aws apigateway create-usage-plan-key
            # --generate-cli-skeleton`). aws:RequestTag/CreatedBy is
            # therefore absent from the request context, StringEquals cannot
            # match an absent key, and the call falls through to an implicit
            # deny.
            #
            # That is exactly what happened between the I-G hardening
            # (dab713d, 2026-05-07) and 2026-07-25: the merged statement made
            # every self-service signup create an enabled key, fail to attach
            # it to the usage plan, and return 503 AccessDeniedException —
            # the whole B2B funnel dead, an orphaned enabled key left behind
            # on each attempt. A security control that silently disabled the
            # feature it was protecting.
            #
            # StringEqualsIfExists would also unblock the call, but only by
            # keeping the two resources merged — and IfExists on /apikeys
            # would silently re-open the hole I-G closed, because a
            # create_api_key call that forgot tags={...} has no
            # aws:RequestTag key either and would pass the same way. Two
            # statements with one condition is the only shape that keeps both
            # properties.
            #
            # Residual scope: this grants "attach any key to any usage plan
            # in the account". keyId is not part of the CreateUsagePlanKey
            # resource ARN, so IAM cannot narrow it further; the wildcard on
            # the usage-plan id is separately required to avoid a circular
            # dependency on ScoreFreeUsagePlan.
            - Effect: Allow
              Action:
                - apigateway:POST
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys'
            - Effect: Allow
              Action:
                - apigateway:GET
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/usageplans'
            - Effect: Allow
              Action:
                # Pre-DELETE lookup, the Lambda verifies the key's name
                # starts with the SignupLambda prefix before deleting.
                # Scoped via the same tag-condition as DELETE for symmetry.
                - apigateway:GET
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/apikeys/*'
              Condition:
                StringEquals:
                  'aws:ResourceTag/CreatedBy': 'SignupLambda'
            - Effect: Allow
              Action:
                # Rollback path, revoke a just-created key when a
                # signup race is detected (DDB ConditionExpression fails
                # after APIGW key already exists). Scoped via tag-based
                # condition to keys this Lambda created (audit N-Code-1):
                # the wildcard /apikeys/* alone would let a compromised
                # signup Lambda delete any API key in the account.
                - apigateway:DELETE
              Resource:
                - !Sub 'arn:aws:apigateway:${AWS::Region}::/apikeys/*'
              Condition:
                StringEquals:
                  'aws:ResourceTag/CreatedBy': 'SignupLambda'
      Events:
        SignupPost:
          # No Auth block, default is no API key required, which is the
          # whole point of self-service signup. Abuse mitigated by per-route
          # APIGW throttle (1 RPS / 5 burst, see MethodSettings above) +
          # per-email idempotency in the handler.
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/signup
            Method: post
        SignupOptions:
          Type: Api
          Properties:
            RestApiId: !Ref FlightMapApi
            Path: /v1/signup
            Method: options

  # NOTE on signup log retention: the log group /aws/lambda/<SignupFunction>
  # was auto-created by Lambda in May 2026, so CloudFormation cannot own it
  # (AWS::Logs::LogGroup fails with AlreadyExists — attempted + rolled back
  # 2026-07-23). Retention is set to 30 days OUT-OF-BAND instead:
  #   aws logs put-retention-policy \
  #     --log-group-name /aws/lambda/<SignupFunction physical name> \
  #     --retention-in-days 30
  # Re-run that command if the function is ever recreated under a new name.
  # Rationale: signup logs must expire — the privacy policy promises
  # delete-on-request, and the handler now logs keyIds, never raw emails.

  # --- DynamoDB Table, Self-service signup audit log ---
  # Email is the partition key (one signup per email, duplicate signups
  # return 409 since APIGW won't let us re-show the key value after
  # creation). Stores keyId for revocation, createdAt for analytics.
  SignupsTable:
    Type: AWS::DynamoDB::Table
    # See PostcodeTable for the rationale — customer signup records are the
    # least replaceable data in the stack.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: london-flight-map-signups
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # Enterprise readiness: 35-day point-in-time recovery for an audit
      # log that records the only mapping between an issued API key and
      # the email that requested it. Cost: ~$0.20/GB-month for backup
      # storage; the table is tiny, so the bill is rounding-error money
      # and the DR posture is meaningfully better. See OPERATIONS.md.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- DynamoDB Table, DEFRA noise raster samples (v3.1) ---
  # Populated by an offline data-loader script that samples the DEFRA
  # GeoTIFF at every UK postcode centroid. The Lambda reads from this table
  # when populated; falls back to v3.0 Haversine when empty/missing.
  # See scripts/load_defra_raster.py for the loader runbook.
  NoiseRasterTable:
    Type: AWS::DynamoDB::Table
    # See PostcodeTable — 423,481 DEFRA raster rows, hours of offline loading
    # to rebuild from the GeoTIFF.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Name matches the london-flight-map-* IAM-policy prefix used by the
      # flightmap-dev deploy user, see backend/iam-policy.json.
      TableName: london-flight-map-noise-raster
      AttributeDefinitions:
        - AttributeName: postcode
          AttributeType: S
      KeySchema:
        - AttributeName: postcode
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # PITR enabled. Re-running the loader from the GeoTIFF would also
      # rebuild this table, but ~6h of compute + bandwidth is real cost,
      # and PITR roll-back to a known-good window is far cheaper if a
      # bad loader run corrupts a chunk of the table.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- DynamoDB Table, ONS NSPL postcode index ---
  # postcode -> LAD + lat/lon for every positioned UK postcode (~2.70M rows,
  # ONS NSPL, Open Government Licence v3.0). Populated offline by
  # scripts/load_nspl.py. Two consumers: (1) the score Lambda resolves UK
  # postcodes locally in milliseconds, demoting postcodes.io to a fallback —
  # a customer backfilling 100k distinct postcodes no longer hammers a free
  # community service; (2) the offline city-scale bulk scorer reads the same
  # table for the Enterprise "score your whole city" CSV.
  # Same PK format as NoiseRasterTable (uppercase, spaces removed) so the two
  # tables share a key space and can be joined or merged without a re-key.
  PostcodeTable:
    Type: AWS::DynamoDB::Table
    # Retain protects ~2.7M loaded rows AND keeps the stack recoverable.
    # `flightmap-dev` has no dynamodb:DeleteTable grant, so a rollback that
    # needs to delete a table is DENIED — wedging the stack in
    # UPDATE_ROLLBACK_FAILED, which this deploy user cannot self-recover from.
    # Retain makes CFN never attempt the delete, so the missing grant can
    # never bite and the data survives regardless. Applied to all four tables
    # 2026-07-26, before the NSPL loader's first run.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Name matches the london-flight-map-* IAM-policy prefix used by the
      # flightmap-dev deploy user, see backend/iam-policy.json.
      TableName: london-flight-map-postcodes
      AttributeDefinitions:
        - AttributeName: postcode
          AttributeType: S
      KeySchema:
        - AttributeName: postcode
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      # PITR enabled. Re-running the loader from data/nspl.csv rebuilds this
      # table, but that is ~30-60 min and ~£1.50 of write units; PITR
      # roll-back to a known-good window is cheaper and far faster if a bad
      # loader run corrupts a chunk of the table.
      # Cost basis: 2,699,393 loadable rows x 1 WRU (every item is far under
      # 1 KB) x USD 0.7065 per million WRU = USD 1.91 ~= GBP 1.51 at USD 1
      # ~= GBP 0.79. eu-west-2 on-demand rates as published 2026-07-25;
      # re-check at the next quarterly reload. The earlier ~£3 figure here
      # quoted DynamoDB's pre-November-2024 write price, which was exactly
      # double the current one — a stale quote is a 2x error. Full workings,
      # including storage and PITR at ~GBP 0.18/month, are in the COST
      # section of scripts/load_nspl.py.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- DynamoDB Table ---
  FavouritesTable:
    Type: AWS::DynamoDB::Table
    # See PostcodeTable — user-saved properties, keyed to device tokens that
    # cannot be reissued, so a lost table is unrecoverable for those users.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: london-flight-map-favourites
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: postcode
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: postcode
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      # PITR enabled. User-generated content (favourites are the only
      # data they write to us) deserves DR protection.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Parameters:
  # Each secret has AllowedPattern '^.+$' so an empty / missing override
  # fails CloudFormation parameter validation BEFORE the changeset runs.
  # Without this, an empty string silently propagates to the Lambda env
  # and the only sign of trouble is upstream timeouts in production
  # (this is exactly how the May 2026 OpenSky live-flights outage was
  # masked for weeks). SAM still preserves previously-set non-empty
  # values when the parameter is omitted from --parameter-overrides,
  # so narrow deploys keep working.
  EpcBearerToken:
    Type: String
    AllowedPattern: '^.+$'
    ConstraintDescription: 'EpcBearerToken must be non-empty. Get from get-energy-performance-data.communities.gov.uk My account, then pass via --parameter-overrides "EpcBearerToken=$EPC_BEARER_TOKEN".'
    NoEcho: true
    Description: Bearer token from get-energy-performance-data.communities.gov.uk (sign in via GOV.UK One Login, copy from the My account page). Pass at deploy time, never commit.

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${FlightMapApi}.execute-api.${AWS::Region}.amazonaws.com/prod/'
