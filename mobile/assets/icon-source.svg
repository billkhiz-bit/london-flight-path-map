<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master icon source for Capacitor-assets generation. 1024×1024 SVG;
  capacitor-assets rasterises and resizes this into all 30+ platform-
  specific icon variants (iOS 1x/2x/3x at every size, Android adaptive
  icon foreground + background, Play Store 512×512 hi-res icon, etc.).

  Run via: cd mobile && npx capacitor-assets generate --assetPath assets

  Design notes:
  - Dark #141414 rounded square reads as "premium product" rather than
    the cyan default Capacitor ships with.
  - Orange #F27D26 airplane is the same accent used throughout the web
    app (score chips, install chips, focus rings).
  - Airplane sized to the inner 60% of canvas so it survives both the
    full-bleed iOS render AND Android's adaptive-icon shape masks
    (circle, squircle, teardrop) without clipping.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sky Score">
  <rect width="1024" height="1024" rx="192" ry="192" fill="#141414"/>
  <g transform="translate(192 192) scale(26.667)" fill="#F27D26">
    <path d="M21,16v-2l-8-5V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/>
  </g>
</svg>
