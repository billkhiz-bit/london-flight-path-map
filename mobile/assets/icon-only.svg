<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sky Score master icon source for capacitor-assets. 1024x1024 SVG;
  capacitor-assets rasterises and resizes this into every iOS icon
  variant (Apple applies its own corner mask on top of the baked rx).

  Design rationale (replaces the placeholder Material-Icons "flight"
  glyph that Apple flagged under guideline 2.3.8 in the v1.0/build 12
  rejection on 2026-05-12):

    Concentric rings = noise contours, the data Sky Score actually
    visualises. The brand orange #F27D26 sits on a deep navy radial
    gradient (sky-at-night). A solid orange disc at the centre carries
    a top-down white aircraft silhouette — top-down because that's the
    radar-contact convention; side-view planes are the cliché Apple's
    reviewers see in every Capacitor template app. Cardinal tick marks
    at N/S/E/W reinforce the radar/measurement read. Slight rotation
    on the aircraft adds movement so the icon doesn't read as a static
    target reticule.

  Run via: cd mobile && npx capacitor-assets generate
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sky Score">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1c2944"/>
      <stop offset="55%" stop-color="#101a2e"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F27D26" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#F27D26" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F27D26" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="discGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFA458"/>
      <stop offset="60%" stop-color="#F27D26"/>
      <stop offset="100%" stop-color="#C95E12"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="192" ry="192" fill="url(#bgGrad)"/>

  <circle cx="512" cy="512" r="280" fill="url(#pulseGlow)"/>

  <g fill="none" stroke="#F27D26" stroke-linecap="round">
    <circle cx="512" cy="512" r="380" stroke-width="3" stroke-opacity="0.22"/>
    <circle cx="512" cy="512" r="300" stroke-width="3.5" stroke-opacity="0.36"/>
    <circle cx="512" cy="512" r="220" stroke-width="4" stroke-opacity="0.55"/>
  </g>

  <g stroke="#F27D26" stroke-width="7" stroke-opacity="0.55" stroke-linecap="round">
    <line x1="512" y1="100" x2="512" y2="148"/>
    <line x1="924" y1="512" x2="876" y2="512"/>
    <line x1="512" y1="924" x2="512" y2="876"/>
    <line x1="100" y1="512" x2="148" y2="512"/>
  </g>

  <circle cx="512" cy="512" r="140" fill="url(#discGrad)"/>

  <g transform="translate(512 512) rotate(-22)" fill="#FFFFFF">
    <path d="M 0,-92 L 8,-34 L 86,4 L 12,8 L 20,58 L 6,68 L 0,74 L -6,68 L -20,58 L -12,8 L -86,4 L -8,-34 Z"/>
    <circle cx="0" cy="0" r="5" fill="#1c2944"/>
  </g>
</svg>
