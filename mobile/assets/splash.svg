<?xml version="1.0" encoding="UTF-8"?>
<!--
  Splash screen source. 2732×2732 (12.9" iPad — biggest size, scales
  down for everything smaller) so capacitor-assets can rasterise to
  every required platform variant without quality loss.

  Light theme to match the app's --bg #e4e3e0 and Sky Score's overall
  feel; airplane centred at ~10% scale so the splash reads as a
  branded loading screen rather than a "this app crashed" white box.
-->
<svg width="2732" height="2732" viewBox="0 0 2732 2732" xmlns="http://www.w3.org/2000/svg">
  <rect width="2732" height="2732" fill="#e4e3e0"/>
  <g transform="translate(1166 1166) scale(16.667)" fill="#141414">
    <path d="M21,16v-2l-8-5V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9l-8,5v2l8-2.5V19l-2,1.5V22l3.5-1l3.5,1v-1.5L13,19v-5.5L21,16z"/>
  </g>
  <text x="1366" y="1900"
        font-family="'JetBrains Mono', 'Inter', monospace"
        font-size="56"
        font-weight="600"
        letter-spacing="6"
        text-anchor="middle"
        fill="#141414">SKY SCORE</text>
</svg>
