<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android adaptive icon BACKGROUND. Solid dark #141414 fill. Pairs with
  icon-foreground.svg; Android composes them into the final adaptive
  icon and applies its launcher's shape mask.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#141414"/>
</svg>
