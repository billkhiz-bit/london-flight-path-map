<!--
  Android adaptive icon FOREGROUND. Transparent background, airplane
  centred and constrained to the inner 60% of canvas — Android's launcher
  shape masks crop the outer 33% so the airplane must sit safely inside.

  Pairs with icon-background.svg via capacitor-assets to produce the
  full Android adaptive icon set (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi,
  round, monochrome themed icon for Android 13+).
-->
