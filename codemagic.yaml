# Codemagic CI/CD config for Sky Score iOS builds.
#
# iOS only. Android is built locally via Android Studio (or `gradlew
# bundleRelease` on the command line) — see mobile/ANDROID_BUILD.md.
# Mirroring the workflow used for the Noor app: cloud Mac is essential
# for iOS because there's no local Mac, but Android builds fine on
# Windows so cloud-Linux time would be pure overhead.
#
# Build runs from the `mobile/` subdirectory. Web assets are assembled
# from the parent web app via `npm run build:web`, then `npx cap sync`
# pushes them into the native iOS project.
#
# Secrets live in Codemagic's dashboard, NOT in this file:
#   - App Store Connect API key (.p8 + Key ID + Issuer ID)
#   - Apple signing certs + provisioning profiles (managed by Codemagic)
#
# Reference: https://docs.codemagic.io/yaml-quick-start/building-an-ionic-capacitor-app/

workflows:
  ios-workflow:
    name: Sky Score iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Signing + publishing both read from explicit env vars, not the
    # Apple Developer Portal name-lookup. Set these as Codemagic env vars
    # (App Settings → Environment Variables, group "asc"):
    #   APP_STORE_CONNECT_PRIVATE_KEY   <-- contents of AuthKey_J746LSWAPG.p8
    #   APP_STORE_CONNECT_KEY_IDENTIFIER = J746LSWAPG
    #   APP_STORE_CONNECT_ISSUER_ID     = cb584bcf-6819-4307-a264-665ed289d43e
    # The .p8 content is secret, the IDs are not. The `groups: [asc]`
    # import below is what actually exposes them to the build — without
    # it, the variables exist in the dashboard but the workflow can't see
    # them, and Codemagic silently falls back to the Developer Portal pool
    # for signing (where Noor's key may get picked over Sky Score's).
    environment:
      groups:
        - asc
      # ios_signing block removed deliberately — Codemagic's pre-flight
      # signing runs before our scripts and uses the Apple Developer Portal
      # pool with selection logic we can't see. Without ios_signing, no
      # pre-flight runs, and signing is handled entirely by our explicit
      # script steps below (keychain initialize, app-store-connect
      # fetch-signing-files, keychain add-certificates) using the
      # $APP_STORE_CONNECT_* env vars from the imported `asc` group.
      vars:
        BUNDLE_ID: "uk.co.skyscore.app"
        XCODE_WORKSPACE: "mobile/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      # Node version: use a specific major.minor (e.g. 20) or full version.
      # Codemagic's `n` version manager rejects the `.x` wildcard format
      # ("Unable to install Node version 20.x"). Use bare major number.
      node: 20
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm deps
        script: |
          cd mobile
          npm ci
      - name: Assemble web bundle
        script: |
          cd mobile
          npm run build:web
      - name: Add iOS platform (regenerated each build)
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios
      - name: Generate icons + splash from SVG sources
        # Must run AFTER `cap add ios` — capacitor-assets only writes to
        # platform directories that already exist on disk. Running this
        # step before `cap add ios` (the original ordering, in place
        # through build 13) silently skipped iOS icon generation, so the
        # iOS build shipped with the Capacitor 7 default cyan-X
        # placeholder icon. This ordering bug was the actual cause of
        # Apple's 2.3.8 "placeholder icons" rejection on 2026-05-12, not
        # the design of logo.svg as initially assumed. Build 14+ should
        # ship the correct radar-rings design generated from
        # mobile/assets/logo.svg.
        script: |
          cd mobile
          npm run build:assets
          # Sanity log: confirm iOS icon set was actually written.
          ls -la ios/App/App/Assets.xcassets/AppIcon.appiconset/ | head -20
      - name: Pod install
        script: |
          cd mobile/ios/App
          pod install
      - name: Set bundle id + version
        script: |
          cd mobile/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD_NUMBER" App/Info.plist
      - name: Limit to iPhone-only (avoids iPad screenshot requirement at submission)
        script: |
          # Capacitor 7 generates a Universal target (TARGETED_DEVICE_FAMILY = "1,2")
          # which makes App Store Connect demand both iPhone AND iPad screenshots at
          # submission. Sky Score is a phone-first GPS app — limiting to iPhone halves
          # the screenshot burden for v1. Can be relaxed later by deleting this step
          # and re-uploading with iPad screenshots in place.
          cd mobile/ios/App
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' App.xcodeproj/project.pbxproj
          echo "TARGETED_DEVICE_FAMILY values after edit:"
          grep TARGETED_DEVICE_FAMILY App.xcodeproj/project.pbxproj || true
      - name: Inject location purpose strings (ITMS-90683)
        script: |
          # @capacitor/geolocation links CLLocationManager symbols that reference
          # both when-in-use and always-authorisation APIs, so Apple's static
          # analysis demands purpose strings for BOTH keys even though Sky Score
          # only ever calls requestWhenInUseAuthorization. Apple's ITMS-90683
          # warning will block App Store submission (TestFlight still works).
          # Add: PlistBuddy -c "Add" fails if the key already exists; "Set" fails
          # if it doesn't. We Delete-then-Add to make this idempotent across the
          # regenerated iOS project on each build.
          cd mobile/ios/App
          PLIST=App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string Sky Score uses your location to show noise, flight-path, and livability data for the area you are currently in. Your location is only read when you tap Score where I am and is never stored or shared." "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string Sky Score only accesses your location while you are actively using the app and never in the background. Your location is only read when you tap Score where I am and is never stored or shared." "$PLIST"
      - name: Fetch signing files via ASC API (reuses persisted cert)
        script: |
          keychain initialize
          # Write the persisted RSA private key from $CERT_PRIVATE_KEY (raw
          # multi-line PEM, lives in Codemagic env-var group 'asc', marked
          # Secure). Same key across every build, so fetch-signing-files
          # reuses the matching Distribution cert instead of creating a new
          # one — routes around Apple Personal Account's 2-cert ceiling.
          #
          # Wave 13.17 tried base64-encoding the key into the env var; the
          # transfer path (Git Bash clip.exe → Codemagic textarea) corrupted
          # some bytes silently and the build failed at the openssl rsa -check
          # guard. Wave 13.18 switched to raw PEM — same format Codemagic
          # already handles successfully for $APP_STORE_CONNECT_PRIVATE_KEY,
          # no encoding round-trip, fewer moving parts.
          #
          # Rotation / first-time setup procedure:
          #   1. Generate locally:  openssl genrsa -out cert_private_key.pem 2048
          #   2. Open the .pem in Notepad (or any plain-text editor)
          #   3. Select all (Ctrl+A), copy (Ctrl+C)
          #   4. Codemagic dashboard → App Settings → Environment Variables
          #      → 'asc' group → set CERT_PRIVATE_KEY = paste (Secure).
          #      Include the -----BEGIN/-----END markers (modern openssl 3.x
          #      emits "PRIVATE KEY" PKCS#8 wrapper; older "RSA PRIVATE KEY"
          #      PKCS#1 is also accepted). Newlines between lines are
          #      preserved by Codemagic's textarea.
          #   5. Revoke orphaned certs at
          #      developer.apple.com/account/resources/certificates/list
          #      so the first persisted-key build has a free slot
          #   6. Delete the local .pem — the env var is now the persistence
          #
          # Codemagic CLI's --certificate-key uses the @file:<path> reference
          # syntax (not @<path>, which fails with "Provided value ... is not
          # valid"). Other accepted forms: literal PEM value, or @env:VAR.
          if [ -z "$CERT_PRIVATE_KEY" ]; then
            echo "ERROR: CERT_PRIVATE_KEY env var missing — see block comment above for setup."
            exit 1
          fi
          printf '%s\n' "$CERT_PRIVATE_KEY" > /tmp/cert_private_key.pem
          if ! openssl rsa -in /tmp/cert_private_key.pem -noout -check 2>/dev/null; then
            echo "ERROR: CERT_PRIVATE_KEY did not parse as a valid RSA private key."
            echo "Hint: paste raw PEM including the -----BEGIN/-----END markers ('PRIVATE KEY' for"
            echo "openssl 3.x PKCS#8, or 'RSA PRIVATE KEY' for legacy PKCS#1), with newlines preserved"
            echo "between lines (Notepad copy-all-paste is reliable on Windows)."
            exit 1
          fi
          app-store-connect fetch-signing-files \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:/tmp/cert_private_key.pem \
            "$BUNDLE_ID"
          keychain add-certificates
      - name: Build .ipa
        script: |
          cd mobile
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Auto-upload to TestFlight on every successful build. Disable
      # this section if you'd rather upload manually for the first run.
      # Reads credentials from Codemagic env vars set in the App's
      # Environment Variables panel (see comment in `environment:` block).
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
