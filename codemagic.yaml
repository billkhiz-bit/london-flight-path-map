# Codemagic CI/CD config for Sky Score iOS builds.
#
# iOS only. Android is built locally via Android Studio (or `gradlew
# bundleRelease` on the command line) — see mobile/ANDROID_BUILD.md.
# Mirroring the workflow used for the Noor app: cloud Mac is essential
# for iOS because there's no local Mac, but Android builds fine on
# Windows so cloud-Linux time would be pure overhead.
#
# Build runs from the `mobile/` subdirectory. Web assets are assembled
# from the parent web app via `npm run build:web`, then `npx cap sync`
# pushes them into the native iOS project.
#
# Secrets live in Codemagic's dashboard, NOT in this file:
#   - App Store Connect API key (.p8 + Key ID + Issuer ID)
#   - Apple signing certs + provisioning profiles (managed by Codemagic)
#
# Reference: https://docs.codemagic.io/yaml-quick-start/building-an-ionic-capacitor-app/

workflows:
  ios-workflow:
    name: Sky Score iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Signing + publishing both read from explicit env vars, not the
    # Apple Developer Portal name-lookup. Set these as Codemagic env vars
    # (App Settings → Environment Variables, group "asc"):
    #   APP_STORE_CONNECT_PRIVATE_KEY   <-- contents of AuthKey_J746LSWAPG.p8
    #   APP_STORE_CONNECT_KEY_IDENTIFIER = J746LSWAPG
    #   APP_STORE_CONNECT_ISSUER_ID     = cb584bcf-6819-4307-a264-665ed289d43e
    # The .p8 content is secret, the IDs are not. The `groups: [asc]`
    # import below is what actually exposes them to the build — without
    # it, the variables exist in the dashboard but the workflow can't see
    # them, and Codemagic silently falls back to the Developer Portal pool
    # for signing (where Noor's key may get picked over Sky Score's).
    environment:
      groups:
        - asc
      # ios_signing block removed deliberately — Codemagic's pre-flight
      # signing runs before our scripts and uses the Apple Developer Portal
      # pool with selection logic we can't see. Without ios_signing, no
      # pre-flight runs, and signing is handled entirely by our explicit
      # script steps below (keychain initialize, app-store-connect
      # fetch-signing-files, keychain add-certificates) using the
      # $APP_STORE_CONNECT_* env vars from the imported `asc` group.
      vars:
        BUNDLE_ID: "uk.co.skyscore.app"
        XCODE_WORKSPACE: "mobile/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      # Node version: use a specific major.minor (e.g. 20) or full version.
      # Codemagic's `n` version manager rejects the `.x` wildcard format
      # ("Unable to install Node version 20.x"). Use bare major number.
      node: 20
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm deps
        script: |
          cd mobile
          npm ci
      - name: Assemble web bundle
        script: |
          cd mobile
          npm run build:web
      - name: Generate icons + splash from SVG sources
        script: |
          cd mobile
          npm run build:assets
      - name: Add iOS platform (regenerated each build)
        script: |
          cd mobile
          npx cap add ios || true
          npx cap sync ios
      - name: Pod install
        script: |
          cd mobile/ios/App
          pod install
      - name: Set bundle id + version
        script: |
          cd mobile/ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD_NUMBER" App/Info.plist
      - name: Fetch signing files via ASC API (creates cert + profile on demand)
        script: |
          keychain initialize
          # Generate a fresh RSA private key on the build VM. The Codemagic
          # CLI tool requires --certificate-key-path so it can either match
          # an existing Distribution cert on Apple's side OR (with --create)
          # mint a new one bound to this private key. Without this, signing
          # fails with "Cannot save Signing Certificates without certificate
          # private key" + "Did not find any certificates from specified
          # locations" (which is what bit us on the first script-stage build).
          openssl genrsa -out /tmp/cert_private_key.pem 2048
          app-store-connect fetch-signing-files \
            --type IOS_APP_STORE \
            --create \
            --certificate-key-path /tmp/cert_private_key.pem \
            "$BUNDLE_ID"
          keychain add-certificates --certificate-key-path /tmp/cert_private_key.pem
      - name: Build .ipa
        script: |
          cd mobile
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # Auto-upload to TestFlight on every successful build. Disable
      # this section if you'd rather upload manually for the first run.
      # Reads credentials from Codemagic env vars set in the App's
      # Environment Variables panel (see comment in `environment:` block).
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
